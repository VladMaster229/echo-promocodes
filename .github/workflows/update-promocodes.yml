name: ECHO Promo Codes Auto Update

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: echo-promocodes-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Search for promo codes
        run: python scripts/update_promocodes.py

      - name: Save updated promo codes
        run: |
          if git diff --quiet -- promocodes.json; then
            echo "No changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add promocodes.json
          git commit -m "Auto-update Wuthering Waves promo codes"
          git push
